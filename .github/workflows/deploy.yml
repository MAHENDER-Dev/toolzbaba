# Keeps this fork in step with Aditya3488/toolzbaba and publishes toolzbaba.com on Cloudflare Pages.
#
# - Every push to master builds and deploys the site.
# - Every 30 minutes it pulls new commits from the original repo; if there are any, it merges, pushes and deploys.
# - "Run workflow" on the Actions tab does the same on demand.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   token with "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  the account id shown in the Cloudflare dashboard URL
name: Sync and deploy

on:
  push:
    branches: [master]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Pull new commits from Aditya3488/toolzbaba
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch https://github.com/Aditya3488/toolzbaba.git master
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "Already up to date with upstream."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git merge --no-edit FETCH_HEAD -m "Merge upstream Aditya3488/toolzbaba"
            git push origin HEAD:master
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether to deploy
        id: go
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set, skipping deploy."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "${{ steps.sync.outputs.changed }}" != "true" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.go.outputs.deploy == 'true'
        with:
          python-version: "3.12"

      - name: Build the static site
        if: steps.go.outputs.deploy == 'true'
        run: python build.py

      - name: Deploy to Cloudflare Pages
        if: steps.go.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name toolzbaba --branch cloudflare-pages --commit-dirty=true
